name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'src/main/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/enzobbom/ts-task:master
            ghcr.io/enzobbom/ts-task:${{ steps.meta.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/enzobbom/ts-task
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger ts-system
        env:
          GH_TOKEN: ${{ secrets.TS_SYSTEM_PAT }}
          IMAGE_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/enzobbom/ts-system/dispatches \
            -d "$(jq -n \
              --arg service "task" \
              --arg tag "${IMAGE_TAG}" \
              '{event_type:"update-image",client_payload:{service:$service,tag:$tag}}')"